<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b5fff" />
  <title>맞춤형 영어학습</title>
  <style>
    :root {
      --bg: #0b1020; --surface: #111a33; --surface2: #1f2945;
      --text: #eaf0ff; --muted: #a9b4d6; --border: rgba(255,255,255,.12);
      --primary: #0b5fff; --primary2: #2dd4ff; --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 20px; --radius2: 16px; --appbar-h: 60px; --tabbar-h: 72px; --maxw: 600px;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f6f8ff; --surface: #ffffff; --surface2: #f1f5ff; --text: #0b1020; --muted: #475569; --border: rgba(2,6,23,.12); }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; touch-action: manipulation; }
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .appbar { height: var(--appbar-h); position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; }
    .content { flex: 1; padding: 20px 16px calc(var(--tabbar-h) + 20px); display: flex; justify-content: center; }
    .container { width: min(var(--maxw), 100%); display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; width: 100%; position: relative; }
    
    .dashboard-6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
    .stat-item { background: var(--surface2); padding: 10px 4px; border-radius: var(--radius2); text-align: center; border: 1px solid var(--border); }
    .stat-label { font-size: 10px; color: var(--muted); margin-bottom: 2px; font-weight: 600; }
    .stat-value { font-size: 15px; font-weight: 800; color: var(--primary2); }
    
    .btn { border: none; background: var(--surface2); padding: 16px; border-radius: var(--radius2); font-weight: 700; display: flex; align-items: center; justify-content: center; color: var(--text); cursor: pointer; width: 100%; margin-bottom: 12px; font-size: 16px; transition: opacity 0.2s; }
    .btn:active { opacity: 0.7; } .btn.primary { background: linear-gradient(135deg, var(--primary), var(--primary2)); color: white; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    
    select, input[type="text"] { width: 100%; padding: 14px; border-radius: 14px; background: var(--surface2); color: var(--text); border: 1px solid var(--border); margin-bottom: 15px; font-size: 18px; text-align: center; appearance: none; -webkit-appearance: none; }
    .display-word { font-size: 32px; font-weight: 900; text-align: center; padding: 15px 0; color: var(--primary2); min-height: 80px; display: flex; align-items: center; justify-content: center; }
    
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; height: var(--tabbar-h); background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
    .tabbar-inner { width: 100%; max-width: var(--maxw); display: grid; grid-template-columns: repeat(2, 1fr); }
    .tab { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .tab[aria-selected="true"] { color: var(--primary2); background: rgba(45, 212, 255, 0.05); }
    
    .view { display: none; } .view.active { display: block; }
    .fav-star-container { cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; }
    .fav-star { font-size: 30px; color: #ccc; transition: color 0.2s; user-select: none; }
    .hidden-check { display: none; }
    .hidden-check:checked + .fav-star { color: #ffcc00; }

    #flash-display { position: relative; min-height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--surface2); border-radius: var(--radius); border: 1px solid var(--border); cursor: pointer; text-align: center; padding: 20px; }
    .flash-fav-pos { position: absolute; top: 12px; right: 12px; z-index: 10; }
    .flash-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }

    #loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; font-weight: 800; text-align: center; padding: 20px; }
    .result-msg { text-align: center; font-weight: 700; min-height: 45px; margin-bottom: 10px; line-height: 1.4; font-size: 15px; }
    .quiz-options-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .quiz-option { background: var(--surface2); border: 1px solid var(--border); padding: 16px; border-radius: 14px; cursor: pointer; text-align: center; font-weight: 600; font-size: 16px; color: var(--text); min-height: 56px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .quiz-option.correct { background: #22c55e !important; color: white; border-color: #22c55e; }
    .quiz-option.wrong { background: #ff4d4f !important; color: white; border-color: #ff4d4f; opacity: 0.7; pointer-events: none; }
    .bulk-actions { display: flex; gap: 8px; margin-bottom: 15px; }
    .btn-small { padding: 10px; font-size: 13px; margin-bottom: 0; flex: 1; }
    
    .count-badge { font-size: 14px; background: var(--primary); color: white; padding: 2px 10px; border-radius: 20px; margin-left: 8px; vertical-align: middle; font-weight: 600; }

    .ms-container { position: relative; width: 100%; margin-bottom: 15px; }
    .ms-header { width: 100%; padding: 14px; border-radius: 14px; background: var(--surface2); color: var(--text); border: 1px solid var(--border); font-size: 18px; text-align: center; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .ms-header::after { content: '▼'; font-size: 12px; opacity: 0.5; }
    .ms-list { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-top: 5px; max-height: 250px; overflow-y: auto; z-index: 200; box-shadow: var(--shadow); }
    .ms-list.show { display: block; }
    .ms-item { padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .ms-item:last-child { border-bottom: none; }
    .ms-item input { width: 18px; height: 18px; cursor: pointer; }
    .ms-item label { flex: 1; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <div id="loading-overlay">데이터를 불러오는 중입니다...</div>

  <div class="app">
    <header class="appbar">📚 맞춤형 영어학습</header>
    <main class="content">
      <div class="container">
        
        <section class="view active" id="view-home">
          <div class="card">
            <div style="font-size:20px; font-weight:900; margin-bottom:12px;">학습 메뉴</div>
            <div class="dashboard-6">
              <div class="stat-item"><div class="stat-label">⭐ 즐겨찾기</div><div class="stat-value" id="dash-fav-count">0</div></div>
              <div class="stat-item"><div class="stat-label">🏁 전체단어</div><div class="stat-value" id="dash-total">0</div></div>
              <div class="stat-item"><div class="stat-label">🔥 학습률</div><div class="stat-value" id="dash-progress">0%</div></div>
            </div>
            <button class="btn primary" onclick="prepareStudy('write')">✍️ 단어 쓰기 (주관식)</button>
            <button class="btn" onclick="prepareStudy('quiz')">✅ 사지선다 퀴즈</button>
            <button class="btn" onclick="prepareStudy('flash')">⚡ 플래시카드</button>
          </div>
        </section>

        <section class="view" id="view-ready">
          <div class="card">
            <div style="font-size:18px; font-weight:800; margin-bottom:16px;">학습 범위 선택</div>
            <select id="ready-day-select"></select>
            <button id="start-btn" class="btn primary">학습 시작하기</button>
            <button class="btn" onclick="switchView('home')">취소</button>
          </div>
        </section>

        <section class="view" id="view-flash">
          <div class="card">
            <div class="dashboard-6">
              <div class="stat-item"><div class="stat-label">📍 현재</div><div class="stat-value" id="f-cur">0</div></div>
              <div class="stat-item"><div class="stat-label">🏁 전체</div><div class="stat-value" id="f-total">0</div></div>
              <div class="stat-item"><div class="stat-label">🔥 진도율</div><div class="stat-value" id="f-progress" style="color:#2dd4ff">0%</div></div>
            </div>
            <div id="flash-display" onclick="flip()">
              <div class="flash-fav-pos" onclick="event.stopPropagation();">
                <label class="fav-star-container">
                  <input type="checkbox" id="f-fav-check" class="hidden-check" onchange="toggleFlashFav(this.checked)">
                  <span class="fav-star">★</span>
                </label>
              </div>
              <div id="f-content" style="width: 100%;"></div>
            </div>
            <div class="flash-btn-grid">
              <button id="f-prev-btn" class="btn" onclick="prevCard()">이전 단어</button>
              <button id="f-next-btn" class="btn primary" onclick="nextCard()">다음 단어</button>
            </div>
            <button class="btn" onclick="switchView('home')" style="margin-top: -2px;">학습 종료</button>
          </div>
        </section>

        <section class="view" id="view-write">
          <div class="card">
            <div class="dashboard-6">
              <div class="stat-item"><div class="stat-label">📍 현재</div><div class="stat-value" id="w-cur">0</div></div>
              <div class="stat-item"><div class="stat-label">🏁 전체</div><div class="stat-value" id="w-total">0</div></div>
              <div class="stat-item"><div class="stat-label">⭕ 맞음</div><div class="stat-value" id="w-right" style="color:#22c55e">0</div></div>
            </div>
            <div class="display-word" id="w-meaning-display"></div>
            <div id="w-result-msg" class="result-msg"></div>
            <input type="text" id="w-input" placeholder="영단어 입력" autocomplete="off" autocapitalize="off">
            <button class="btn primary" onclick="checkWrite()">정답 확인</button>
            <button class="btn" onclick="switchView('home')">학습 종료</button>
          </div>
        </section>

        <section class="view" id="view-quiz">
          <div class="card">
            <div class="dashboard-6">
              <div class="stat-item"><div class="stat-label">📍 현재</div><div class="stat-value" id="q-cur">0</div></div>
              <div class="stat-item"><div class="stat-label">🏁 전체</div><div class="stat-value" id="q-total">0</div></div>
              <div class="stat-item"><div class="stat-label">⭕ 맞음</div><div class="stat-value" id="q-right" style="color:#22c55e">0</div></div>
            </div>
            <div id="q-word" class="display-word"></div>
            <div id="q-options" class="quiz-options-grid"></div>
            <button class="btn" onclick="switchView('home')" style="margin-top:20px;">학습 종료</button>
          </div>
        </section>

        <section class="view" id="view-words">
          <div class="card">
            <div style="font-size:20px; font-weight:900; margin-bottom:12px;">
                📖 내 단어장 <span id="list-fav-count" class="count-badge">0</span>
            </div>
            <div class="ms-container">
              <div class="ms-header" id="ms-header" onclick="toggleMsList()">범위: 전체</div>
              <div class="ms-list" id="ms-list"></div>
            </div>
            <div class="bulk-actions">
                <button class="btn btn-small" onclick="bulkFavorite(true)">✨ 모두 선택</button>
                <button class="btn btn-small" onclick="bulkFavorite(false)">❌ 모두 해제</button>
            </div>
            <div id="word-list-container"></div>
          </div>
        </section>

      </div>
    </main>
    <nav class="tabbar">
      <div class="tabbar-inner">
        <button class="tab" id="tab-home" aria-selected="true" onclick="switchView('home')">🏠<span>홈</span></button>
        <button class="tab" id="tab-words" onclick="switchView('words')">📖<span>단어장</span></button>
      </div>
    </nav>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyF9phDAUNsa_-wjt4E4SyvDM71DTkqA-CPMFQhInZ4YvdvEylgsgC_IEy4k0dSn14/exec";

    let appData = { words: [] };
    let filteredWords = [];
    let curIdx = 0;
    let flipped = false;
    let quizStats = { right: 0 };
    let selectedDays = ['all'];
    let currentQuestionAttempted = false; // 현재 문제 오답 시도 여부 추적

    async function init() {
      try {
        const response = await fetch(API_URL);
        appData = await response.json();
        document.getElementById('loading-overlay').style.display = 'none';
        const days = [...new Set(appData.words.map(w => w.day))].filter(Boolean).sort();
        
        const readyHtml = '<option value="all">전체보기</option><option value="fav">⭐ 즐겨찾기</option>' + days.map(d => `<option value="${d}">${d}</option>`).join('');
        document.getElementById('ready-day-select').innerHTML = readyHtml;

        const msList = document.getElementById('ms-list');
        let msHtml = `<div class="ms-item" onclick="handleMsClick(event, 'all')"><input type="checkbox" value="all" id="cb-all" checked> <label>전체보기</label></div><div class="ms-item" onclick="handleMsClick(event, 'fav')"><input type="checkbox" value="fav" id="cb-fav"> <label>⭐ 즐겨찾기</label></div>`;
        msHtml += days.map(d => `<div class="ms-item" onclick="handleMsClick(event, '${d}')"><input type="checkbox" value="${d}" id="cb-${d}"> <label>${d}</label></div>`).join('');
        msList.innerHTML = msHtml;

        updateHomeStats();
      } catch (e) {
        console.error(e);
        document.getElementById('loading-overlay').innerHTML = "❌ 데이터를 가져오지 못했습니다.";
      }
    }

    function toggleMsList() { document.getElementById('ms-list').classList.toggle('show'); }
    window.onclick = function(event) { if (!event.target.closest('.ms-container')) { document.getElementById('ms-list').classList.remove('show'); } }

    function handleMsClick(e, val) {
      e.stopPropagation();
      const cb = document.getElementById(`cb-${val}`);
      if (e.target.tagName !== 'INPUT') cb.checked = !cb.checked;

      if (val === 'all') {
        if (cb.checked) {
          selectedDays = ['all'];
          document.querySelectorAll('.ms-list input').forEach(i => { if(i.id !== 'cb-all') i.checked = false; });
        } else cb.checked = true;
      } else {
        document.getElementById('cb-all').checked = false;
        selectedDays = Array.from(document.querySelectorAll('.ms-list input:checked')).map(i => i.value);
        if (selectedDays.length === 0) { document.getElementById('cb-all').checked = true; selectedDays = ['all']; }
      }
      const header = document.getElementById('ms-header');
      header.textContent = selectedDays.includes('all') ? "범위: 전체" : `범위: ${selectedDays.length}개 선택됨`;
      renderWordList();
    }

    function updateHomeStats() {
      if (!appData.words) return;
      const total = appData.words.length;
      const favs = appData.words.filter(w => w.favorite).length;
      document.getElementById('dash-fav-count').textContent = favs;
      document.getElementById('dash-total').textContent = total;
      document.getElementById('dash-progress').textContent = (total > 0 ? Math.round((favs / total) * 100) : 0) + "%";
      const badge = document.getElementById('list-fav-count');
      if(badge) badge.textContent = favs;
    }

    function switchView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + id).classList.add('active');
      document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', 'false'));
      if(id === 'words') renderWordList();
      if(id === 'home') updateHomeStats();
      const tabId = (['ready','flash','write','quiz'].includes(id)) ? 'home' : id;
      document.getElementById('tab-' + tabId).setAttribute('aria-selected', 'true');
    }

    function toggleFav(id, checked) {
      const word = appData.words.find(w => w.id == id);
      if(word) { word.favorite = checked; updateHomeStats(); }
    }

    function toggleFlashFav(checked) {
      const word = filteredWords[curIdx];
      if(word) toggleFav(word.id, checked);
    }

    function startFlash() { switchView('flash'); curIdx = 0; flipped = false; updateFlash(); }
    function updateFlash() {
      const w = filteredWords[curIdx];
      document.getElementById('f-cur').textContent = curIdx + 1;
      document.getElementById('f-total').textContent = filteredWords.length;
      document.getElementById('f-progress').textContent = Math.round(((curIdx + 1) / filteredWords.length) * 100) + "%";
      document.getElementById('f-fav-check').checked = w.favorite;
      document.getElementById('f-prev-btn').disabled = (curIdx === 0);
      document.getElementById('f-content').innerHTML = flipped ? 
        `<div style="font-size:32px; font-weight:900; color:var(--primary2);">${w.word}</div><div style="font-size:22px; margin-top:20px; border-top:1px solid var(--border); padding-top:20px; width:80%; margin: 20px auto 0;">${w.meaning}</div>` : 
        `<div style="font-size:32px; font-weight:900; color:var(--primary2);">${w.word}</div><div style="margin-top:15px; color:var(--muted); font-size:14px;">터치하여 뜻 보기</div>`;
      if(!flipped) speak(w.word);
    }

    function flip() { flipped = !flipped; updateFlash(); }
    function nextCard() { if(curIdx < filteredWords.length - 1) { curIdx++; flipped = false; updateFlash(); } else { alert("모든 단어를 학습했습니다!"); switchView('home'); } }
    function prevCard() { if(curIdx > 0) { curIdx--; flipped = false; updateFlash(); } }

    function prepareStudy(type) {
      switchView('ready');
      document.getElementById('start-btn').onclick = () => {
        const filter = document.getElementById('ready-day-select').value;
        filteredWords = (filter === 'all') ? [...appData.words] : (filter === 'fav') ? appData.words.filter(w => w.favorite) : appData.words.filter(w => w.day == filter);
        if(!filteredWords.length) return alert("단어가 없습니다.");
        filteredWords.sort(() => Math.random() - 0.5);
        if(type === 'flash') startFlash();
        else if(type === 'write') { curIdx = 0; quizStats.right = 0; startWrite(); }
        else { curIdx = 0; quizStats.right = 0; startQuiz(); }
      };
    }

    function startWrite() { switchView('write'); currentQuestionAttempted = false; updateWrite(); }
    function updateWrite() {
      const w = filteredWords[curIdx];
      document.getElementById('w-meaning-display').textContent = w.meaning;
      document.getElementById('w-input').value = ''; document.getElementById('w-input').focus();
      document.getElementById('w-cur').textContent = curIdx+1;
      document.getElementById('w-total').textContent = filteredWords.length;
      document.getElementById('w-right').textContent = quizStats.right;
      document.getElementById('w-result-msg').innerHTML = '';
    }
    function checkWrite() {
      if(document.getElementById('w-input').value.trim().toLowerCase() === filteredWords[curIdx].word.toLowerCase()) {
        if(!currentQuestionAttempted) quizStats.right++; 
        speak(filteredWords[curIdx].word);
        if(curIdx < filteredWords.length - 1) { curIdx++; currentQuestionAttempted = false; updateWrite(); } 
        else { finishStudy(); }
      } else { 
        currentQuestionAttempted = true;
        document.getElementById('w-result-msg').innerHTML = `❌ 정답: <b style="color:#ff4d4f">${filteredWords[curIdx].word}</b>`; 
      }
    }

    function startQuiz() { switchView('quiz'); currentQuestionAttempted = false; updateQuiz(); }
    function updateQuiz() {
      const t = filteredWords[curIdx];
      document.getElementById('q-word').textContent = t.word;
      let opts = [t.meaning, ...appData.words.filter(w=>w.meaning!==t.meaning).sort(()=>Math.random()-0.5).slice(0,3).map(w=>w.meaning)].sort(()=>Math.random()-0.5);
      document.getElementById('q-options').innerHTML = opts.map(o => `<div class="quiz-option" onclick="checkQuiz('${o}', this)">${o}</div>`).join('');
      document.getElementById('q-cur').textContent = curIdx+1;
      document.getElementById('q-total').textContent = filteredWords.length;
      document.getElementById('q-right').textContent = quizStats.right;
      speak(t.word);
    }
    function checkQuiz(o, btn) {
      if(o === filteredWords[curIdx].meaning) {
        btn.classList.add('correct'); 
        if(!currentQuestionAttempted) quizStats.right++;
        setTimeout(() => { 
          if(curIdx < filteredWords.length - 1) { curIdx++; currentQuestionAttempted = false; updateQuiz(); } 
          else { finishStudy(); } 
        }, 800);
      } else { 
        currentQuestionAttempted = true;
        btn.classList.add('wrong'); 
      }
    }

    function finishStudy() {
      const rate = Math.round((quizStats.right / filteredWords.length) * 100);
      alert(`학습 완료!\n맞은 개수: ${quizStats.right} / ${filteredWords.length}\n정답률: ${rate}%`);
      switchView('home');
    }

    function renderWordList() {
      let list = selectedDays.includes('all') ? appData.words : appData.words.filter(w => selectedDays.includes('fav') && w.favorite || selectedDays.includes(String(w.day)));
      updateHomeStats();
      document.getElementById('word-list-container').innerHTML = list.map(w => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px; border-bottom:1px solid var(--border);">
          <div style="display:flex; align-items:center; gap:12px;">
            <label class="fav-star-container"><input type="checkbox" class="hidden-check" ${w.favorite ? 'checked' : ''} onchange="toggleFav('${w.id}', this.checked)"><span class="fav-star">★</span></label>
            <div><div style="font-weight:800; color:var(--primary2); font-size:18px;">${w.word}</div><div style="font-size:14px; opacity:0.7;">${w.meaning} (Day ${w.day})</div></div>
          </div>
          <button style="background:var(--primary); color:white; border:none; width:36px; height:36px; border-radius:50%;" onclick="speak('${w.word}')">🔊</button>
        </div>`).join('') || '<div style="text-align:center; padding:40px; color:var(--muted);">없음</div>';
    }

    function bulkFavorite(status) {
      let listToUpdate = selectedDays.includes('all') ? appData.words : appData.words.filter(w => selectedDays.includes('fav') && w.favorite || selectedDays.includes(String(w.day)));
      listToUpdate.forEach(w => w.favorite = status);
      renderWordList(); updateHomeStats();
    }

    function speak(t) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'en-US'; u.rate = 0.8;
      window.speechSynthesis.speak(u);
    }

    window.onload = init;
    document.getElementById('w-input').addEventListener('keypress', e => { if(e.key==='Enter') checkWrite(); });
  </script>
</body>
</html>

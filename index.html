<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b5fff" />
  <title>맞춤형 영어학습</title>
  <style>
    :root {
      --bg: #0b1020; --surface: #111a33; --surface2: #1f2945;
      --text: #eaf0ff; --muted: #a9b4d6; --border: rgba(255,255,255,.12);
      --primary: #0b5fff; --primary2: #2dd4ff; --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 20px; --radius2: 16px; --appbar-h: 60px; --tabbar-h: 72px; --maxw: 600px;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f6f8ff; --surface: #ffffff; --surface2: #f1f5ff; --text: #0b1020; --muted: #475569; --border: rgba(2,6,23,.12); }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; touch-action: manipulation; }
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .appbar { height: var(--appbar-h); position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; }
    .content { flex: 1; padding: 20px 16px calc(var(--tabbar-h) + 20px); display: flex; justify-content: center; }
    .container { width: min(var(--maxw), 100%); display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; width: 100%; position: relative; }
    
    .dashboard-6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
    .stat-item { background: var(--surface2); padding: 10px 4px; border-radius: var(--radius2); text-align: center; border: 1px solid var(--border); }
    .stat-label { font-size: 10px; color: var(--muted); margin-bottom: 2px; font-weight: 600; }
    .stat-value { font-size: 15px; font-weight: 800; color: var(--primary2); }
    
    .btn { border: none; background: var(--surface2); padding: 16px; border-radius: var(--radius2); font-weight: 700; display: flex; align-items: center; justify-content: center; color: var(--text); cursor: pointer; width: 100%; margin-bottom: 12px; font-size: 16px; transition: opacity 0.2s; }
    .btn:active { opacity: 0.7; } .btn.primary { background: linear-gradient(135deg, var(--primary), var(--primary2)); color: white; }
    
    select, input[type="text"], input[type="number"] { width: 100%; padding: 14px; border-radius: 14px; background: var(--surface2); color: var(--text); border: 1px solid var(--border); margin-bottom: 15px; font-size: 18px; text-align: center; appearance: none; -webkit-appearance: none; }
    .display-word { font-size: 32px; font-weight: 900; text-align: center; padding: 15px 0; color: var(--primary2); min-height: 80px; display: flex; align-items: center; justify-content: center; }
    
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; height: var(--tabbar-h); background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
    .tabbar-inner { width: 100%; max-width: var(--maxw); display: grid; grid-template-columns: repeat(3, 1fr); }
    .tab { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .tab[aria-selected="true"] { color: var(--primary2); 
      background: rgba(45, 212, 255, 0.15); 
      border-radius: 12px;
      margin: 4px; 
    }
    
    .view { display: none; } .view.active { display: block; }
    .fav-star-container { cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; }
    .fav-star { font-size: 26px; color: #ccc; transition: color 0.2s; user-select: none; }
    .hidden-check { display: none; }
    .hidden-check:checked + .fav-star { color: #ffcc00; }

    #flash-display { position: relative; min-height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--surface2); border-radius: var(--radius); border: 1px solid var(--border); cursor: pointer; text-align: center; padding: 20px; }
    .flash-fav-pos { position: absolute; top: 12px; right: 12px; z-index: 10; }
    .flash-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }

    #loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; font-weight: 800; text-align: center; padding: 20px; }
    .result-msg { text-align: center; font-weight: 700; min-height: 45px; margin-bottom: 10px; line-height: 1.4; font-size: 15px; }
    .quiz-options-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .quiz-option { background: var(--surface2); border: 1px solid var(--border); padding: 16px; border-radius: 14px; cursor: pointer; text-align: center; font-weight: 600; font-size: 16px; color: var(--text); min-height: 56px; display: flex; align-items: center; justify-content: center; }
    .quiz-option.correct { background: #22c55e !important; color: white; border-color: #22c55e; }
    .quiz-option.wrong { background: #ff4d4f !important; color: white; border-color: #ff4d4f; opacity: 0.7; pointer-events: none; }
    
    .ms-container { position: relative; width: 100%; margin-bottom: 10px; }
    .ms-header { width: 100%; padding: 14px; border-radius: 14px; background: var(--surface2); color: var(--text); border: 1px solid var(--border); font-size: 18px; text-align: center; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .ms-header::after { content: '▼'; font-size: 12px; opacity: 0.5; }
    .ms-list { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-top: 5px; max-height: 250px; overflow-y: auto; z-index: 200; box-shadow: var(--shadow); }
    .ms-list.show { display: block; }
    .ms-item { padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .ms-item input { width: 18px; height: 18px; cursor: pointer; }

    .fav-bulk-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .btn-sm { padding: 8px; font-size: 13px; margin-bottom: 0; border: 1px solid var(--border); }

    /* 통계 스타일 */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .stats-card { background: var(--surface2); padding: 16px; border-radius: var(--radius2); border: 1px solid var(--border); }
    .stats-title { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
    .stats-value-lg { font-size: 24px; font-weight: 900; color: var(--primary2); }
    .history-item { padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .history-type { font-weight: 800; font-size: 15px; }
    .history-date { font-size: 12px; color: var(--muted); }
    .history-score { font-weight: 700; color: var(--primary2); }
    .progress-bar-bg { width: 100%; height: 8px; background: var(--border); border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--primary2); transition: width 0.3s; }

    /* 오답노트 전용 스타일 */
    .wrong-item { padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(255, 77, 79, 0.05); }
    .wrong-word { font-weight: 800; color: #ff4d4f; font-size: 16px; }
    .wrong-meaning { font-size: 13px; color: var(--muted); }
    .wrong-btn-group { display: flex; gap: 8px; }
    .btn-circle { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--surface2); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
    .btn-delete { color: #ff4d4f; }
  </style>
</head>
<body>
  <div id="loading-overlay">데이터를 불러오는 중입니다...</div>

  <div class="app">
    <header class="appbar">📚 맞춤형 영어학습</header>
    <main class="content">
      <div class="container">
        
        <section class="view active" id="view-home">
          <div class="card">
            <div style="font-size:20px; font-weight:900; margin-bottom:12px;">학습 메뉴</div>
            <div class="dashboard-6">
              <div class="stat-item"><div class="stat-label">⭐ 즐겨찾기</div><div class="stat-value" id="dash-fav-count">0</div></div>
              <div class="stat-item"><div class="stat-label">🏁 전체단어</div><div class="stat-value" id="dash-total">0</div></div>
              <div class="stat-item"><div class="stat-label">🔥 학습률</div><div class="stat-value" id="dash-progress">0%</div></div>
            </div>
            <button class="btn primary" style="background: linear-gradient(135deg, #FF8C00, #FFA500);" onclick="prepareStudy('listen')">🎧 듣기 평가 (받아쓰기+퀴즈)</button>
            <button class="btn primary" style="background: linear-gradient(135deg, #6A11CB, #2575FC);" onclick="prepareStudy('test')">📝 랜덤 단어 시험</button>
            <button class="btn primary" style="background: linear-gradient(135deg, #11998E, #38EF7D);" onclick="prepareStudy('write')">✍️ 단어 쓰기 (주관식)</button>
            <button class="btn primary" style="background: linear-gradient(135deg, #4FACFE, #00F2FE);" onclick="prepareStudy('quiz')">✅ 사지선다 퀴즈</button>
            <button class="btn primary" style="background: linear-gradient(135deg, #F093FB, #F5576C);" onclick="prepareStudy('flash')">⚡ 플래시카드</button>
          </div>
        </section>

        <section class="view" id="view-ready">
          <div class="card">
            <div style="font-size:18px; font-weight:800; margin-bottom:16px;">학습 범위 선택</div>
            <select id="ready-day-select" style="margin-bottom: 5px;"></select>
            <div id="ready-count-display" style="font-size:13px; color:var(--primary2); text-align:center; margin-bottom:15px; font-weight:600;">(현재 선택된 단어: 0개)</div>
            
            <div id="ready-test-count-container" style="display:none; margin-bottom: 15px;">
              <div style="font-size:14px; color:var(--muted); margin-bottom:8px; text-align:center;">시험 단어 수 (숫자 입력)</div>
              <input type="number" id="ready-test-count" placeholder="미입력시 랜덤 50%" min="1">
            </div>

            <button id="start-btn" class="btn primary">학습 시작하기</button>
            <button class="btn" onclick="switchView('home')">취소</button>
          </div>
        </section>

        <section class="view" id="view-listen">
          <div class="card">
            <div class="dashboard-6">
              <div class="stat-item"><div class="stat-label">📍 현재</div><div class="stat-value" id="l-cur">0</div></div>
              <div class="stat-item"><div class="stat-label">🏁 전체</div><div class="stat-value" id="l-total">0</div></div>
              <div class="stat-item"><div class="stat-label">⭕ 맞음</div><div class="stat-value" id="l-right" style="color:#22c55e">0</div></div>
            </div>
            
            <div id="l-phase1">
              <div class="display-word" style="cursor:pointer;" onclick="playListenAudio()">
                <div style="background:var(--primary); color:white; width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto; font-size:36px; box-shadow:0 4px 10px rgba(0,0,0,0.2); transition:transform 0.1s;">🔊</div>
              </div>
              <div style="text-align:center; color:var(--muted); font-size:14px; margin-bottom:15px;">스피커를 눌러 소리를 들으세요</div>
              <div id="l-result-msg" class="result-msg"></div>
              <input type="text" id="l-input" placeholder="스펠링을 적어주세요" autocomplete="off" autocapitalize="off">
              <button id="l-check-btn" class="btn primary" onclick="checkListenWrite()">정답 확인</button>
              
              <div class="flash-btn-grid" style="margin-top:0; margin-bottom:12px;">
                <button class="btn" onclick="prevListen()">이전 단어</button>
                <button class="btn" onclick="nextListen()">다음 단어</button>
              </div>
            </div>

            <div id="l-phase2" style="display:none;">
              <div id="l-word" class="display-word"></div>
              <div id="l-options" class="quiz-options-grid"></div>
            </div>

            <button class="btn" onclick="switchView('home')" style="margin-top:12px;">학습 종료</button>
          </div>
        </section>

        <section class="view" id="view-flash">
          <div class="card">
            <div class="dashboard-6">
              <div class="stat-item"><div class="stat-label">📍 현재</div><div class="stat-value" id="f-cur">0</div></div>
              <div class="stat-item"><div class="stat-label">🏁 전체</div><div class="stat-value" id="f-total">0</div></div>
              <div class="stat-item"><div class="stat-label">🔥 진도율</div><div class="stat-value" id="f-progress" style="color:#2dd4ff">0%</div></div>
            </div>
            <div id="flash-display" onclick="flip()">
              <div class="flash-fav-pos" onclick="event.stopPropagation();">
                <label class="fav-star-container">
                  <input type="checkbox" id="f-fav-check" class="hidden-check" onchange="toggleFlashFav(this.checked)">
                  <span class="fav-star">★</span>
                </label>
              </div>
              <div id="f-content" style="width: 100%;"></div>
            </div>
            <div class="flash-btn-grid">
              <button id="f-prev-btn" class="btn" onclick="prevCard()">이전 단어</button>
              <button id="f-next-btn" class="btn primary" onclick="nextCard()">다음 단어</button>
            </div>
            <button class="btn" onclick="switchView('home')">학습 종료</button>
          </div>
        </section>

        <section class="view" id="view-write">
          <div class="card">
            <div class="dashboard-6">
              <div class="stat-item"><div class="stat-label">📍 현재</div><div class="stat-value" id="w-cur">0</div></div>
              <div class="stat-item"><div class="stat-label">🏁 전체</div><div class="stat-value" id="w-total">0</div></div>
              <div class="stat-item"><div class="stat-label">⭕ 맞음</div><div class="stat-value" id="w-right" style="color:#22c55e">0</div></div>
            </div>
            <div class="display-word" id="w-meaning-display"></div>
            <div id="w-result-msg" class="result-msg"></div>
            <input type="text" id="w-input" placeholder="영단어 입력" autocomplete="off" autocapitalize="off">
            
            <button id="w-check-btn" class="btn primary" onclick="checkWrite()">정답 확인</button>
            
            <div class="flash-btn-grid" style="margin-top:0; margin-bottom:12px;">
              <button class="btn" onclick="prevWrite()">이전 단어</button>
              <button class="btn" onclick="nextWrite()">다음 단어</button>
            </div>

            <button class="btn" onclick="switchView('home')">학습 종료</button>
          </div>
        </section>

        <section class="view" id="view-quiz">
          <div class="card">
            <div class="dashboard-6">
              <div class="stat-item"><div class="stat-label">📍 현재</div><div class="stat-value" id="q-cur">0</div></div>
              <div class="stat-item"><div class="stat-label">🏁 전체</div><div class="stat-value" id="q-total">0</div></div>
              <div class="stat-item"><div class="stat-label">⭕ 맞음</div><div class="stat-value" id="q-right" style="color:#22c55e">0</div></div>
              </div>
              <div id="q-word" class="display-word"></div>
              <div id="q-options" class="quiz-options-grid"></div>
              <button class="btn" onclick="switchView('home')" style="margin-top:20px;">학습 종료</button>
              </div>
              </section>

        <section class="view" id="view-words">
          <div class="card">
            <div style="font-size:20px; font-weight:900; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
              <span>📖 내 단어장</span>
              <span id="word-fav-badge" style="font-size:14px; background:var(--surface2); padding:4px 10px; border-radius:10px; color:#ffcc00;">⭐ <span id="fav-count-num" style="color:var(--primary2);">0</span></span>
            </div>
            <div class="ms-container">
              <div class="ms-header" id="ms-header" onclick="toggleMsList()">범위: 전체</div>
              <div class="ms-list" id="ms-list"></div>
            </div>
            <div class="fav-bulk-actions">
              <button class="btn btn-sm" onclick="bulkFavorite(true)">⭐ 모두 선택</button>
              <button class="btn btn-sm" onclick="bulkFavorite(false)">☆ 모두 해제</button>
            </div>
            <div id="word-list-container"></div>
          </div>
        </section>

        <section class="view" id="view-stats">
          <div class="card">
            <div style="font-size:20px; font-weight:900; margin-bottom:12px;">📊 학습 통계</div>
            <div class="stats-grid">
              <div class="stats-card">
                <div class="stats-title">평균 정답률</div>
                <div class="stats-value-lg" id="stat-avg-accuracy">0%</div>
                <div class="progress-bar-bg"><div id="stat-avg-bar" class="progress-bar-fill" style="width:0%"></div></div>
              </div>
              <div class="stats-card">
                <div class="stats-title">총 학습 횟수</div>
                <div class="stats-value-lg" id="stat-total-sessions">0</div>
              </div>
            </div>

            <div style="font-size:16px; font-weight:800; margin: 15px 0 10px; display: flex; justify-content: space-between; align-items: center;">
              <span>🚨 오답노트</span>
              <button onclick="clearWrongNote()" style="background: none; border: none; color: #ff4d4f; font-size: 12px; font-weight: 700; cursor: pointer;">전체 비우기</button>
            </div>
            <div id="wrong-note-container" style="background: var(--surface2); border-radius: var(--radius2); border: 1px solid var(--border); overflow: hidden; margin-bottom: 25px; max-height: 300px; overflow-y: auto;">
              <div style="padding:40px; text-align:center; color:var(--muted);">틀린 단어가 없습니다.</div>
            </div>

            <div style="font-size:16px; font-weight:800; margin: 15px 0 10px;">🕒 최근 학습 히스토리</div>
            <div id="history-container" style="background: var(--surface2); border-radius: var(--radius2); border: 1px solid var(--border); overflow: hidden;">
              <div style="padding:40px; text-align:center; color:var(--muted);">히스토리가 없습니다.</div>
            </div>
            <button class="btn" onclick="clearHistory()" style="margin-top:20px; color:#ff4d4f; font-size:14px;">히스토리 전체 삭제</button>
          </div>
        </section>

      </div>
    </main>
    <nav class="tabbar">
      <div class="tabbar-inner">
        <button class="tab" id="tab-home" aria-selected="true" onclick="switchView('home')">🏠<span>홈</span></button>
        <button class="tab" id="tab-words" onclick="switchView('words')">📖<span>단어장</span></button>
        <button class="tab" id="tab-stats" onclick="switchView('stats')">📊<span>통계</span></button>
      </div>
    </nav>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyF9phDAUNsa_-wjt4E4SyvDM71DTkqA-CPMFQhInZ4YvdvEylgsgC_IEy4k0dSn14/exec";

    let appData = { words: [] };
    let filteredWords = [];
    let curIdx = 0;
    let flipped = false;
    let quizStats = { right: 0 };
    let selectedDays = ['all'];
    let hasAnsweredCurrent = false;
    let isWrongState = false;
    let l_isWrongState = false; 
    let currentStudyType = '';

    // 현재 즐겨찾기 상태를 기기(localStorage)에 저장하는 함수
    function saveFavsToLocal() {
      if (!appData.words) return;
      const favIds = appData.words.filter(w => w.favorite).map(w => w.id);
      localStorage.setItem('myVocabFavs', JSON.stringify(favIds));
    }

    async function init() {
      try {
        const response = await fetch(API_URL);
        appData = await response.json();
        document.getElementById('loading-overlay').style.display = 'none';
        
        // localStorage에서 저장된 즐겨찾기 목록 불러오기
        const savedFavs = JSON.parse(localStorage.getItem('myVocabFavs') || '[]');

        appData.words.forEach(w => { 
          // 저장된 내역이 있으면 해당 단어를 즐겨찾기로 설정
          if (savedFavs.includes(w.id)) {
            w.favorite = true;
          } else if(w.favorite === undefined) {
            w.favorite = false; 
          }
        });

        const days = [...new Set(appData.words.map(w => w.day))].filter(Boolean).sort();
        
        const readyHtml = '<option value="all">전체보기</option><option value="fav">⭐ 즐겨찾기</option>' + days.map(d => `<option value="${d}">${d}</option>`).join('');
        document.getElementById('ready-day-select').innerHTML = readyHtml;

        const msList = document.getElementById('ms-list');
        let msHtml = `<div class="ms-item" onclick="handleMsClick(event, 'all')"><input type="checkbox" value="all" id="cb-all" checked> <label>전체보기</label></div>`;
        msHtml += `<div class="ms-item" onclick="handleMsClick(event, 'fav')"><input type="checkbox" value="fav" id="cb-fav"> <label>⭐ 즐겨찾기</label></div>`;
        msHtml += days.map(d => `<div class="ms-item" onclick="handleMsClick(event, '${d}')"><input type="checkbox" value="${d}" id="cb-${d}"> <label>${d}</label></div>`).join('');
        msList.innerHTML = msHtml;

        updateHomeStats();
        renderWordList();
      } catch (e) {
        document.getElementById('loading-overlay').innerHTML = "❌ 데이터를 가져오지 못했습니다.";
      }
    }

    function toggleMsList() { document.getElementById('ms-list').classList.toggle('show'); }
    function handleMsClick(e, val) {
      e.stopPropagation();
      const cb = document.getElementById(`cb-${val}`);
      if (e.target.tagName !== 'INPUT') cb.checked = !cb.checked;
      if (val === 'all') {
        if (cb.checked) {
          selectedDays = ['all'];
          document.querySelectorAll('.ms-list input').forEach(i => { if(i.id !== 'cb-all') i.checked = false; });
        } else { cb.checked = true; }
      } else {
        document.getElementById('cb-all').checked = false;
        const checkedBoxes = Array.from(document.querySelectorAll('.ms-list input:checked')).map(i => i.value);
        selectedDays = checkedBoxes.length ? checkedBoxes : ['all'];
        if (selectedDays[0] === 'all') document.getElementById('cb-all').checked = true;
      }
      document.getElementById('ms-header').textContent = selectedDays.includes('all') ? "범위: 전체" : `범위: ${selectedDays.length}개 선택`;
      renderWordList();
    }

    function updateHomeStats() {
      if (!appData.words) return;
      const total = appData.words.length;
      const favs = appData.words.filter(w => w.favorite).length;
      document.getElementById('dash-fav-count').textContent = favs;
      document.getElementById('dash-total').textContent = total;
      document.getElementById('dash-progress').textContent = (total > 0 ? Math.round((favs / total) * 100) : 0) + "%";
      const badgeNum = document.getElementById('fav-count-num');
      if(badgeNum) badgeNum.textContent = favs;
    }

    function switchView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + id).classList.add('active');
      document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', 'false'));
      if(id === 'home' || id === 'words') updateHomeStats();
      if(id === 'stats') renderStats();
      const tabId = (['ready','flash','write','quiz','listen'].includes(id)) ? 'home' : id;
      document.getElementById('tab-' + tabId).setAttribute('aria-selected', 'true');
    }

    function toggleFav(id, checked) {
      const word = appData.words.find(w => w.id == id);
      if(word) {
        word.favorite = checked;
        saveFavsToLocal(); // 즐겨찾기 변경 시 로컬에 저장
        updateHomeStats();
        if(selectedDays.includes('fav')) renderWordList();
      }
    }

    function bulkFavorite(status) {
      let listToChange = [];
      if (selectedDays.includes('all')) {
        listToChange = appData.words;
      } else {
        listToChange = appData.words.filter(w => {
          const daySelected = selectedDays.includes(String(w.day));
          const favSelected = selectedDays.includes('fav') && w.favorite;
          return daySelected || favSelected;
        });
      }
      
      if(listToChange.length === 0) return;
      
      listToChange.forEach(w => { w.favorite = status; });
      saveFavsToLocal(); // 즐겨찾기 일괄 변경 시 로컬에 저장
      updateHomeStats();
      renderWordList();
    }

    function toggleFlashFav(checked) {
      const word = filteredWords[curIdx];
      if(word) toggleFav(word.id, checked);
    }

    function prepareStudy(type) {
      currentStudyType = type;
      const countContainer = document.getElementById('ready-test-count-container');
      const countInput = document.getElementById('ready-test-count');
      const countDisplay = document.getElementById('ready-count-display');
      const daySelect = document.getElementById('ready-day-select');
      
      const updateReadyCount = () => {
        const filter = daySelect.value;
        let count = 0;
        if(filter === 'all') count = appData.words.length;
        else if(filter === 'fav') count = appData.words.filter(w => w.favorite).length;
        else count = appData.words.filter(w => w.day == filter).length;
        countDisplay.textContent = `(현재 선택된 단어: ${count}개)`;
      };

      if(type === 'test') {
        countContainer.style.display = 'block';
        countInput.value = ''; 
      } else {
        countContainer.style.display = 'none';
      }

      daySelect.onchange = updateReadyCount;
      updateReadyCount();

      switchView('ready');
      document.getElementById('start-btn').onclick = () => {
        const filter = daySelect.value;
        if(filter === 'all') filteredWords = [...appData.words];
        else if(filter === 'fav') filteredWords = appData.words.filter(w => w.favorite);
        else filteredWords = appData.words.filter(w => w.day == filter);
        
        if(!filteredWords.length) return alert("단어가 없습니다.");
        
        // 랜덤 셔플
        filteredWords.sort(() => Math.random() - 0.5);
        
        // 시험 모드인 경우 사용자 입력값만큼 선택
        if(type === 'test') {
          let testCount = parseInt(countInput.value);
          if(isNaN(testCount) || testCount <= 0) {
            testCount = Math.ceil(filteredWords.length * 0.5); // 입력 없으면 기본 50%
          }
          filteredWords = filteredWords.slice(0, testCount);
        }

        curIdx = 0; quizStats.right = 0;
        
        if(type === 'flash') startFlash();
        else if(type === 'write' || type === 'test') startWrite(); 
        else if(type === 'quiz') startQuiz();
        else if(type === 'listen') startListen(); 
      };
    }

    /* ====== 주관식 로직 ====== */
    function startWrite() { isWrongState = false; switchView('write'); updateWrite(); }
    function updateWrite() {
      const w = filteredWords[curIdx];
      document.getElementById('w-meaning-display').textContent = w.meaning;
      document.getElementById('w-input').value = '';
      document.getElementById('w-input').disabled = false;
      document.getElementById('w-input').focus();
      document.getElementById('w-result-msg').innerHTML = '';
      document.getElementById('w-cur').textContent = curIdx+1;
      document.getElementById('w-total').textContent = filteredWords.length;
      document.getElementById('w-right').textContent = quizStats.right;
      document.getElementById('w-check-btn').textContent = "정답 확인";
    }

    function prevWrite() {
      if (curIdx > 0) { curIdx--; isWrongState = false; updateWrite(); }
      else { alert("첫 번째 단어입니다."); }
    }

    function nextWrite() {
      if (curIdx < filteredWords.length - 1) { curIdx++; isWrongState = false; updateWrite(); }
      else { finishSession(); }
    }

    function checkWrite() {
      const input = document.getElementById('w-input').value.trim().toLowerCase();
      const answer = filteredWords[curIdx].word.toLowerCase();
      const msgArea = document.getElementById('w-result-msg');
      const btn = document.getElementById('w-check-btn');

      if (msgArea.innerHTML.includes('정답입니다') || msgArea.innerHTML.includes('확인되었습니다')) {
        nextWrite();
        return;
      }

      if(input === answer) {
        if(!isWrongState) { 
          quizStats.right++; 
          document.getElementById('w-right').textContent = quizStats.right;
          msgArea.innerHTML = `<b style="color:#22c55e">정답입니다! ✨</b><br><span style="font-size:12px; opacity:0.8;">[정답 확인]을 눌러 다음으로 이동</span>`; 
        }
        else { msgArea.innerHTML = `<b style="color:#2dd4ff">확인되었습니다!</b><br><span style="font-size:12px; opacity:0.8;">[정답 확인]을 눌러 다음으로 이동</span>`; }
        speak(filteredWords[curIdx].word);
        document.getElementById('w-input').disabled = true;
        document.getElementById('w-input').blur();
        btn.textContent = "다음 문제로 ▶";
      } else {
        isWrongState = true;
        addWrongWord(filteredWords[curIdx]); // 오답노트 추가
        msgArea.innerHTML = `❌ 정답: <b style="color:#ff4d4f">${filteredWords[curIdx].word}</b><br><span style="font-size:12px; opacity:0.8;">위 단어를 똑같이 입력하세요!</span>`;
        document.getElementById('w-input').value = '';
        document.getElementById('w-input').focus();
        btn.textContent = "정답 확인";
      }
    }

    /* ====== 사지선다 로직 ====== */
    function startQuiz() { switchView('quiz'); updateQuiz(); }
    function updateQuiz() {
      hasAnsweredCurrent = false;
      const t = filteredWords[curIdx];
      document.getElementById('q-word').textContent = t.word;
      let opts = [t.meaning, ...appData.words.filter(w=>w.meaning!==t.meaning).sort(()=>Math.random()-0.5).slice(0,3).map(w=>w.meaning)].sort(()=>Math.random()-0.5);
      document.getElementById('q-options').innerHTML = opts.map(o => `<div class="quiz-option" onclick="checkQuiz('${o}', this)">${o}</div>`).join('');
      document.getElementById('q-cur').textContent = curIdx+1;
      document.getElementById('q-total').textContent = filteredWords.length;
      document.getElementById('q-right').textContent = quizStats.right;
      speak(t.word);
    }
    function checkQuiz(o, btn) {
      if(o === filteredWords[curIdx].meaning) {
        btn.classList.add('correct');
        if (!hasAnsweredCurrent) {
          quizStats.right++;
          document.getElementById('q-right').textContent = quizStats.right;
        }
        document.querySelectorAll('.quiz-option').forEach(opt => opt.style.pointerEvents = 'none');
        setTimeout(() => { if(curIdx < filteredWords.length - 1) { curIdx++; updateQuiz(); } else { finishSession(); } }, 800);
      } else { 
        btn.classList.add('wrong'); 
        if (!hasAnsweredCurrent) addWrongWord(filteredWords[curIdx]); // 오답노트 추가
        hasAnsweredCurrent = true; 
      }
    }

    /* ====== 플래시카드 로직 ====== */
    function startFlash() { switchView('flash'); curIdx = 0; flipped = false; updateFlash(); }
    function updateFlash() {
      const w = filteredWords[curIdx];
      document.getElementById('f-cur').textContent = curIdx + 1;
      document.getElementById('f-total').textContent = filteredWords.length;
      document.getElementById('f-progress').textContent = Math.round(((curIdx+1)/filteredWords.length)*100) + "%";
      document.getElementById('f-fav-check').checked = w.favorite || false;
      document.getElementById('f-content').innerHTML = flipped ? `<div style="font-size:32px; font-weight:900; color:var(--primary2);">${w.word}</div><div style="font-size:22px; margin-top:20px; border-top:1px solid var(--border); padding-top:20px; width:80%; margin: 20px auto 0;">${w.meaning}</div>` : `<div style="font-size:32px; font-weight:900; color:var(--primary2);">${w.word}</div><div style="margin-top:15px; color:var(--muted); font-size:14px;">터치하여 뜻 보기</div>`;
      if(!flipped) speak(w.word);
    }
    function flip() { flipped = !flipped; updateFlash(); }
    function nextCard() { if(curIdx < filteredWords.length - 1) { curIdx++; flipped = false; updateFlash(); } else { switchView('home'); } }
    function prevCard() { if(curIdx > 0) { curIdx--; flipped = false; updateFlash(); } }

    /* ====== 듣기 평가 로직 ====== */
    function startListen() { 
      switchView('listen'); 
      updateListen(); 
    }

    function updateListen() {
      l_isWrongState = false;
      document.getElementById('l-cur').textContent = curIdx + 1;
      document.getElementById('l-total').textContent = filteredWords.length;
      document.getElementById('l-right').textContent = quizStats.right;
      
      document.getElementById('l-phase1').style.display = 'block';
      document.getElementById('l-phase2').style.display = 'none';
      
      document.getElementById('l-input').value = '';
      document.getElementById('l-input').disabled = false;
      document.getElementById('l-input').focus();
      document.getElementById('l-result-msg').innerHTML = '';
      
      playListenAudio();
    }

    function playListenAudio() {
      speak(filteredWords[curIdx].word);
    }

    function checkListenWrite() {
      const input = document.getElementById('l-input').value.trim().toLowerCase();
      const answer = filteredWords[curIdx].word.toLowerCase();
      const msgArea = document.getElementById('l-result-msg');

      if(input === answer) {
        msgArea.innerHTML = `<b style="color:#22c55e">정답입니다! ✨</b><br><span style="font-size:12px; opacity:0.8;">의미 맞추기로 넘어갑니다...</span>`;
        document.getElementById('l-input').disabled = true;
        document.getElementById('l-input').blur();
        
        setTimeout(() => { transitionToListenQuiz(); }, 800);
      } else {
        l_isWrongState = true;
        addWrongWord(filteredWords[curIdx]); // 오답노트 추가
        msgArea.innerHTML = `❌ 정답: <b style="color:#ff4d4f">${filteredWords[curIdx].word}</b><br><span style="font-size:12px; opacity:0.8;">위 단어를 똑같이 적어주세요!</span>`;
        document.getElementById('l-input').value = '';
        document.getElementById('l-input').focus();
        playListenAudio();
      }
    }

    function transitionToListenQuiz() {
      document.getElementById('l-phase1').style.display = 'none';
      document.getElementById('l-phase2').style.display = 'block';
      
      const t = filteredWords[curIdx];
      document.getElementById('l-word').textContent = t.word;
      
      let opts = [t.meaning, ...appData.words.filter(w=>w.meaning!==t.meaning).sort(()=>Math.random()-0.5).slice(0,3).map(w=>w.meaning)].sort(()=>Math.random()-0.5);
      document.getElementById('l-options').innerHTML = opts.map(o => `<div class="quiz-option" onclick="checkListenQuiz('${o}', this)">${o}</div>`).join('');
    }

    function checkListenQuiz(o, btn) {
      if(o === filteredWords[curIdx].meaning) {
        btn.classList.add('correct');
        if (!l_isWrongState) {
          quizStats.right++;
          document.getElementById('l-right').textContent = quizStats.right;
        }
        document.querySelectorAll('#l-options .quiz-option').forEach(opt => opt.style.pointerEvents = 'none');
        
        setTimeout(() => { 
          if(curIdx < filteredWords.length - 1) { 
            curIdx++; 
            updateListen(); 
          } else { 
            finishSession();
          } 
        }, 800);
      } else { 
        btn.classList.add('wrong'); 
        if(!l_isWrongState) addWrongWord(filteredWords[curIdx]); // 오답노트 추가
        l_isWrongState = true;
      }
    }

    function prevListen() {
      if (curIdx > 0) { curIdx--; updateListen(); }
      else { alert("첫 번째 단어입니다."); }
    }

    function nextListen() {
      if (curIdx < filteredWords.length - 1) { curIdx++; updateListen(); }
      else { alert("마지막 단어입니다."); }
    }

    /* ====== 통계 및 히스토리 ====== */
    function finishSession() {
      saveSession(currentStudyType, filteredWords.length, quizStats.right);
      alert(`완료! (${filteredWords.length}문제 중 ${quizStats.right}문제 정답)`);
      switchView('home');
    }

    function saveSession(type, total, right) {
      const history = JSON.parse(localStorage.getItem('studyHistory') || '[]');
      const typeMap = { 'listen': '🎧 듣기', 'test': '📝 시험', 'write': '✍️ 쓰기', 'quiz': '✅ 퀴즈' };
      const newEntry = {
        date: new Date().toISOString(),
        type: typeMap[type] || type,
        total: total,
        right: right,
        accuracy: Math.round((right / total) * 100)
      };
      history.unshift(newEntry);
      localStorage.setItem('studyHistory', JSON.stringify(history.slice(0, 50))); // 최대 50개 저장
    }

    function addWrongWord(wordObj) {
      let wrongNote = JSON.parse(localStorage.getItem('wrongNote') || '[]');
      // 중복 체크 (id 기준)
      if(!wrongNote.some(w => w.id === wordObj.id)) {
        wrongNote.unshift({
          id: wordObj.id,
          word: wordObj.word,
          meaning: wordObj.meaning,
          date: new Date().toISOString()
        });
        localStorage.setItem('wrongNote', JSON.stringify(wrongNote));
      }
    }

    function deleteWrongWord(id) {
      let wrongNote = JSON.parse(localStorage.getItem('wrongNote') || '[]');
      wrongNote = wrongNote.filter(w => w.id !== id);
      localStorage.setItem('wrongNote', JSON.stringify(wrongNote));
      renderStats();
    }

    function clearWrongNote() {
      if(confirm("오답노트를 모두 비우시겠습니까?")) {
        localStorage.removeItem('wrongNote');
        renderStats();
      }
    }

    function renderStats() {
      // 1. 학습 히스토리 렌더링
      const history = JSON.parse(localStorage.getItem('studyHistory') || '[]');
      const totalSessions = history.length;
      document.getElementById('stat-total-sessions').textContent = totalSessions;

      if (totalSessions > 0) {
        const avgAccuracy = Math.round(history.reduce((acc, cur) => acc + cur.accuracy, 0) / totalSessions);
        document.getElementById('stat-avg-accuracy').textContent = avgAccuracy + "%";
        document.getElementById('stat-avg-bar').style.width = avgAccuracy + "%";

        const historyHtml = history.map(h => {
          const d = new Date(h.date);
          const dateStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
          return `
            <div class="history-item">
              <div>
                <div class="history-type">${h.type}</div>
                <div class="history-date">${dateStr}</div>
              </div>
              <div class="history-score">${h.accuracy}% (${h.right}/${h.total})</div>
            </div>`;
        }).join('');
        document.getElementById('history-container').innerHTML = historyHtml;
      } else {
        document.getElementById('stat-avg-accuracy').textContent = "0%";
        document.getElementById('stat-avg-bar').style.width = "0%";
        document.getElementById('history-container').innerHTML = '<div style="padding:40px; text-align:center; color:var(--muted);">히스토리가 없습니다.</div>';
      }

      // 2. 오답노트 렌더링
      const wrongNote = JSON.parse(localStorage.getItem('wrongNote') || '[]');
      if(wrongNote.length > 0) {
        const wrongHtml = wrongNote.map(w => `
          <div class="wrong-item">
            <div>
              <div class="wrong-word">${w.word}</div>
              <div class="wrong-meaning">${w.meaning}</div>
            </div>
            <div class="wrong-btn-group">
              <button class="btn-circle" onclick="speak('${w.word}')">🔊</button>
              <button class="btn-circle btn-delete" onclick="deleteWrongWord('${w.id}')">✕</button>
            </div>
          </div>
        `).join('');
        document.getElementById('wrong-note-container').innerHTML = wrongHtml;
      } else {
        document.getElementById('wrong-note-container').innerHTML = '<div style="padding:40px; text-align:center; color:var(--muted);">틀린 단어가 없습니다.</div>';
      }
    }

    function clearHistory() {
      if(confirm("모든 히스토리를 삭제하시겠습니까?")) {
        localStorage.removeItem('studyHistory');
        renderStats();
      }
    }

    /* ================================== */

    function renderWordList() {
      let list = [];
      if (selectedDays.includes('all')) {
        list = appData.words;
      } else {
        list = appData.words.filter(w => {
          const daySelected = selectedDays.includes(String(w.day));
          const favSelected = selectedDays.includes('fav') && w.favorite;
          return daySelected || favSelected;
        });
      }

      document.getElementById('word-list-container').innerHTML = list.map(w => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px; border-bottom:1px solid var(--border);">
          <div style="display:flex; align-items:center; gap:12px;">
            <label class="fav-star-container">
              <input type="checkbox" class="hidden-check" ${w.favorite ? 'checked' : ''} onchange="toggleFav('${w.id}', this.checked)">
              <span class="fav-star">★</span>
            </label>
            <div>
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-size:12px; color:var(--muted); font-weight:normal;">(${w.day})</span>
                <div style="font-weight:800; color:var(--primary2); font-size:18px;">${w.word}</div>
              </div>
              <div style="font-size:14px; opacity:0.7;">${w.meaning}</div>
            </div>
          </div>
          <button style="background:var(--primary); color:white; border:none; width:36px; height:36px; border-radius:50%;" onclick="speak('${w.word}')">🔊</button>
        </div>`).join('') || '<div style="text-align:center; padding:40px; color:var(--muted);">단어가 없습니다.</div>';
    }

    function speak(t) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.8; window.speechSynthesis.speak(u); }
    window.onload = init;
    
    document.getElementById('w-input').addEventListener('keypress', e => { if(e.key==='Enter') checkWrite(); });
    document.getElementById('l-input').addEventListener('keypress', e => { if(e.key==='Enter') checkListenWrite(); });
  </script>
</body>
</html>
